# Publishes the e2e stack so an agent running on the host can reach it.
#
# The e2e stack deliberately publishes nothing: the Playwright runner lives
# inside its network. An agent evaluation is different — `claude` runs on the
# operator's machine, so the platform has to be reachable from there.
#
# The ports are deliberately NOT 8000/4200: the development stack owns those,
# and an evaluation that silently drove the development database would be worse
# than no evaluation at all.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml -f docker-compose.evals.yml up -d --wait
name: portfolioos-e2e

services:
  server:
    ports:
      - "8100:8000"

  client:
    ports:
      - "4300:4200"
