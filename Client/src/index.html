<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>PortfolioOS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Applies the stored theme BEFORE first paint, so the app never flashes the
    // wrong one while Angular boots. Keep the storage key in sync with
    // `theme.service.ts` (THEME_STORAGE_KEY).
    (() => {
      var pref = 'system';
      try {
        var stored = localStorage.getItem('portfolio-theme');
        if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored;
      } catch (e) {}
      var theme = pref;
      if (pref === 'system') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
