<article class="kpi">
  <p class="kpi-label">{{ label() }}</p>
  <div class="kpi-row">
    <strong class="kpi-value">{{ value() }}</strong>
  </div>
  @if (subtitle()) {
    <p
      class="kpi-foot"
      [class.kpi-foot-positive]="tone() === 'positive'"
      [class.kpi-foot-negative]="tone() === 'negative'">
      @if (supportingIcon()) {
        <mat-icon class="kpi-foot-icon">{{ supportingIcon() }}</mat-icon>
      }
      {{ subtitle() }}
    </p>
  }
</article>
