<main class="login-page" id="main-content">
  <div class="login-card">
    <img class="login-logo-on-light" src="logo-light.svg" alt="BRQ Portfolio" />
    <img class="login-logo-on-dark" src="logo-dark.svg" alt="" aria-hidden="true" />

    <div class="login-intro">
      <h1 class="login-title">Entrar</h1>
      <p class="login-subtitle">Acesse o painel de portfólio</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
        <div class="error-banner" role="alert">
          <mat-icon aria-hidden="true">error_outline</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <div class="field">
        <label class="field-label" for="login-username">Usuário</label>
        <mat-form-field appearance="outline">
          <input id="login-username" matInput formControlName="username" autocomplete="username" />
        </mat-form-field>
      </div>

      <div class="field">
        <label class="field-label" for="login-password">Senha</label>
        <mat-form-field appearance="outline">
          <input
            id="login-password"
            matInput
            formControlName="password"
            [type]="hidePassword() ? 'password' : 'text'"
            autocomplete="current-password" />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword.set(!hidePassword())"
            [attr.aria-label]="hidePassword() ? 'Mostrar senha' : 'Esconder senha'">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
      </div>

      <button
        mat-flat-button
        class="login-submit"
        type="submit"
        [disabled]="form.invalid || loading()">
        @if (loading()) {
          Entrando...
        } @else {
          Entrar
        }
      </button>
    </form>
  </div>
</main>
