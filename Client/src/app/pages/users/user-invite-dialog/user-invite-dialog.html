<app-dialog-header title="Gerar Convite" />
<mat-dialog-content>
  <form [formGroup]="form" id="invite-form" (ngSubmit)="onSubmit()" class="invite-form">
    <div class="field">
      <label class="field-label" id="l-99af-email" for="f-99af-email">Email do convidado<span class="field-required" aria-hidden="true">*</span></label>
      <mat-form-field appearance="outline">
  <input id="f-99af-email"
          matInput
          formControlName="email"
          type="email"
          autocomplete="email"
          placeholder="nome@empresa.com" />
        @if (form.controls.email.hasError('required')) {
          <mat-error>Informe o email</mat-error>
        } @else if (form.controls.email.hasError('email')) {
          <mat-error>Informe um email válido</mat-error>
        }
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close [disabled]="loading()">Cancelar</button>
  <button
    mat-flat-button
    color="primary"
    form="invite-form"
    type="submit"
    [disabled]="form.invalid || loading()">
    @if (loading()) {
      Gerando...
    } @else {
      Gerar e copiar link
    }
  </button>
</mat-dialog-actions>
