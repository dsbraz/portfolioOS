<app-dialog-header title="Gerar link de indicador" />

<mat-dialog-content>
  <form [formGroup]="form" class="token-form">
    <div class="form-row">
      <div class="field">
        <label class="field-label" id="l-087b-month" for="f-087b-month">Mes</label>
        <mat-form-field appearance="outline">
  <mat-select aria-label="Mes" formControlName="month">
            @for (m of monthOptions; track m) {
              <mat-option [value]="m">{{ monthLabels[m] }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field">
        <label class="field-label" id="l-087b-year" for="f-087b-year">Ano</label>
        <mat-form-field appearance="outline">
  <input id="f-087b-year" matInput type="number" formControlName="year" />
        </mat-form-field>
      </div>
    </div>

    @if (form.hasError('futurePeriod')) {
      <mat-error class="period-error">Periodo nao pode ser no futuro.</mat-error>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="onCancel()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="form.invalid">
    Gerar e copiar
  </button>
</mat-dialog-actions>
