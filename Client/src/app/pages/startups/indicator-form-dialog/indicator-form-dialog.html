@if (isReadonly) {
  <app-dialog-header title="Indicador Mensal" />
} @else {
  <app-dialog-header [title]="isEditMode ? 'Editar Indicador Mensal' : 'Novo Indicador Mensal'" />
}

<mat-dialog-content>
  @if (isReadonly) {
    <app-read-view [sections]="readSections" />
  } @else {
  <form [formGroup]="form" class="indicator-form">
    <div class="form-row">
      <div class="field">
        <label class="field-label" id="l-9312-month" for="f-9312-month">Mês</label>
        <mat-form-field appearance="outline">
  <mat-select aria-label="Mês" formControlName="month">
            @for (m of monthOptions; track m) {
              <mat-option [value]="m">{{ monthLabels[m] }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field">
        <label class="field-label" id="l-9312-year" for="f-9312-year">Ano</label>
        <mat-form-field appearance="outline">
  <input id="f-9312-year" matInput type="number" (wheel)="$event.target.blur()" formControlName="year" />
        </mat-form-field>
      </div>
    </div>
    @if (form.hasError('futurePeriod')) {
      <mat-error class="period-error">Período não pode ser no futuro.</mat-error>
    }

    <h3 class="section-title">Quantitativos</h3>

    <div class="form-row">
      <div class="field">
        <label class="field-label" id="l-9312-total_revenue" for="f-9312-total_revenue">Receita do mês</label>
        <mat-form-field appearance="outline">
  <input id="f-9312-total_revenue" matInput type="number" (wheel)="$event.target.blur()" formControlName="total_revenue" />
          <span matTextPrefix class="field-affix">R$&nbsp;</span>
        </mat-form-field>
      </div>

      <div class="field">
        <label class="field-label" id="l-9312-recurring_revenue_pct" for="f-9312-recurring_revenue_pct">Percentual de receita recorrente</label>
        <mat-form-field appearance="outline">
  <input id="f-9312-recurring_revenue_pct" matInput type="number" (wheel)="$event.target.blur()" formControlName="recurring_revenue_pct" />
          <span matTextSuffix class="field-affix">%</span>
        </mat-form-field>
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label class="field-label" id="l-9312-gross_margin_pct" for="f-9312-gross_margin_pct">Margem bruta</label>
        <mat-form-field appearance="outline">
  <input id="f-9312-gross_margin_pct" matInput type="number" (wheel)="$event.target.blur()" formControlName="gross_margin_pct" />
          <span matTextSuffix class="field-affix">%</span>
        </mat-form-field>
      </div>

      <div class="field">
        <label class="field-label" id="l-9312-cash_balance" for="f-9312-cash_balance">Saldo em caixa</label>
        <mat-form-field appearance="outline">
  <input id="f-9312-cash_balance" matInput type="number" (wheel)="$event.target.blur()" formControlName="cash_balance" />
          <span matTextPrefix class="field-affix">R$&nbsp;</span>
        </mat-form-field>
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label class="field-label" id="l-9312-headcount" for="f-9312-headcount">Headcount</label>
        <mat-form-field appearance="outline">
  <input id="f-9312-headcount" matInput type="number" (wheel)="$event.target.blur()" formControlName="headcount" />
        </mat-form-field>
      </div>

      <div class="field">
        <label class="field-label" id="l-9312-ebitda_burn" for="f-9312-ebitda_burn">Burn / EBITDA</label>
        <mat-form-field appearance="outline">
  <input id="f-9312-ebitda_burn" matInput type="number" (wheel)="$event.target.blur()" formControlName="ebitda_burn" />
          <span matTextPrefix class="field-affix">R$&nbsp;</span>
        </mat-form-field>
      </div>
    </div>

    <h3 class="section-title">Qualitativos</h3>

    <div class="field">
      <label class="field-label" id="l-9312-achievements" for="f-9312-achievements">Conquistas do mês</label>
      <mat-form-field appearance="outline">
  <textarea id="f-9312-achievements" matInput formControlName="achievements" rows="3"></textarea>
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" id="l-9312-challenges" for="f-9312-challenges">Desafios do mês</label>
      <mat-form-field appearance="outline">
  <textarea id="f-9312-challenges" matInput formControlName="challenges" rows="3"></textarea>
      </mat-form-field>
    </div>

    <h3 class="section-title">Anotações do fundo</h3>
    <div class="field">
      <label class="field-label" id="l-9312-comments" for="f-9312-comments">Comentários do fundo</label>
      <mat-form-field appearance="outline">
  <textarea id="f-9312-comments" matInput formControlName="comments" rows="3"></textarea>
      </mat-form-field>
    </div>
  </form>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (isReadonly) {
    <button mat-stroked-button (click)="onCancel()">Fechar</button>
  } @else {
    <button mat-stroked-button (click)="onCancel()">Cancelar</button>
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="form.invalid">
      {{ isEditMode ? 'Salvar' : 'Adicionar' }}
    </button>
  }
</mat-dialog-actions>
