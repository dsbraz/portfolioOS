@if (isReadonly) {
  <app-dialog-header title="Reunião de Conselho" />
} @else {
  <app-dialog-header [title]="isEditMode ? 'Editar Reunião de Conselho' : 'Nova Reunião de Conselho'" />
}

<mat-dialog-content>
  @if (isReadonly) {
    <app-read-view [sections]="readSections" />
  } @else {
  <form [formGroup]="form" class="meeting-form">
    <div class="field">
      <label class="field-label" id="l-2482-meeting_date" for="f-2482-meeting_date">Data<span class="field-required" aria-hidden="true">*</span></label>
      <mat-form-field appearance="outline">
  <input id="f-2482-meeting_date" matInput [matDatepicker]="picker" formControlName="meeting_date" />
        <mat-datepicker-toggle matIconSuffix [for]="picker" />
        <mat-datepicker #picker />
        @if (form.controls.meeting_date.hasError('required')) {
          <mat-error>Data é obrigatória</mat-error>
        }
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" id="l-2482-participants" for="f-2482-participants">Participantes</label>
      <mat-form-field appearance="outline">
  <textarea id="f-2482-participants" matInput formControlName="participants" rows="3"></textarea>
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" id="l-2482-summary" for="f-2482-summary">Resumo</label>
      <mat-form-field appearance="outline">
  <textarea id="f-2482-summary" matInput formControlName="summary" rows="3"></textarea>
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" id="l-2482-attention_points" for="f-2482-attention_points">Pontos de Atenção</label>
      <mat-form-field appearance="outline">
  <textarea id="f-2482-attention_points" matInput formControlName="attention_points" rows="3"></textarea>
      </mat-form-field>
    </div>

    <div class="field">
      <label class="field-label" id="l-2482-next_steps" for="f-2482-next_steps">Próximos passos</label>
      <mat-form-field appearance="outline">
  <textarea id="f-2482-next_steps" matInput formControlName="next_steps" rows="3"></textarea>
      </mat-form-field>
    </div>
  </form>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (isReadonly) {
    <button mat-stroked-button (click)="onCancel()">Fechar</button>
  } @else {
    <button mat-stroked-button (click)="onCancel()">Cancelar</button>
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="form.invalid">
      {{ isEditMode ? 'Salvar' : 'Adicionar' }}
    </button>
  }
</mat-dialog-actions>
