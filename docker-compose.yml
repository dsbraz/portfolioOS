services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./Server
    ports:
      - "8000:8000"
    volumes:
      - ./Server:/app
      # Source of the skill package: the builder and its tests read it from
      # here. The served archive is `Server/static/portfolioos.zip`, already in
      # the image.
      - ./skills:/skills
      # Read-only, and a single file: the briefing shell shipped inside the
      # skill package snapshots the brand tokens, and a test pins the two so a
      # token change cannot silently desync what the agent delivers.
      - ./Client/src/styles.scss:/brand/styles.scss:ro
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PYTHONPATH: /app
    command: >
      bash -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./Client
    ports:
      - "4200:4200"
    volumes:
      - ./Client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server

volumes:
  postgres_data:
  client_node_modules:
