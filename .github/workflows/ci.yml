name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same stack definition the e2e job uses, so CI cannot drift from the
      # environment the suite is developed in — including the database: the
      # suite runs against PostgreSQL, on a database of its own that
      # `tests/conftest.py` creates and migrates.
      # Before the suite, and without the database: a linter that fails in
      # seconds should not wait on Postgres.
      - name: Lint
        run: docker compose -f docker-compose.e2e.yml run --rm --no-deps server ruff check app scripts tests
      - name: Run the suite
        run: docker compose -f docker-compose.e2e.yml run --rm server pytest -q

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      # Production build, not development: AOT and budgets only fail here.
      - run: npx ng build --configuration production

  e2e:
    name: E2E (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring the isolated stack up
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait
      - name: Run the suite
        run: docker compose -f docker-compose.e2e.yml run --rm e2e npx playwright test
      - name: Collect the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: Client/e2e-results/
          retention-days: 7
      - name: Server logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs server
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
